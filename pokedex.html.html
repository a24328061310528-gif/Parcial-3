<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pokedex.css">
</head>

<body>
    <h1>MAESTRO POKEMON: Mario Antonio Segura Fuentes</h1>
    <img src="pokemon.PNG" width="400px" style="top:0px; margin: 0 auto; display: block;">
    <input type="text" placeholder="MewTwo" id="pokeName" name="pokeName" class="placeholder"> <br>
    <img src="Pokemon_NO.PNG" alt="PokeMaster" id="pokeImg" width="250px" class="pokeImg"><br>

    <div id="pokeName" class="pokeimg1" style="left: 100px; top: 200px; font-size: 15px;"></div>
    <div id="pokeHe" class="pokeimg1" style="left: 100px; top: 220px; font-size: 15px;"></div>
    <div id="pokeWe" class="pokeimg1" style="left: 100px; top: 240px; font-size: 15px;"></div>
    <div id="pokeType" class="pokeimg1" style="left: 100px; top: 260px; font-size: 15px;"></div>
    <div id="pokeitem" class="pokeimg1" style="left: 100px; top: 280px; font-size: 15px;"></div>
    <div id="pokemove1" class="pokeimg1" style="left: 100px; top: 280px; font-size: 15px;"></div>
    <div id="pokemove2" class="pokeimg1" style="left: 100px; top: 300px; font-size: 15px;"></div>
    <div id="pokemove3" class="pokeimg1" style="left: 100px; top: 320px; font-size: 15px;"></div>
    <div id="pokemove4" class="pokeimg1" style="left: 100px; top: 340px; font-size: 15px;"></div>

    <div id="pokeid" class="pokeimg1"
        style="left: 600px; top: 500px; font-size: 200px; color: yellow; background: transparent; border: none; box-shadow: none;">
    </div>
    <div id="pokeorder" class="pokeimg1"
        style="left: 700px; top: 500px; font-size: 20px; color: orange; background: transparent; border: none; box-shadow: none;">
    </div>

    <button onclick="fetchPokemon()" class="button"> Presiona</button>
    <div class="grafica" style="margin: 20px auto; width: 400px; height: 300px;">
        <canvas id="miCanvas"></canvas>
    </div>
    <script src="pokedex.js"></script>
    <script src="Chart.js"></script>
</body>

</html>
